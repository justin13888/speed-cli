# release-plz: automate version bumps, CHANGELOG, GitHub Releases, and crates.io
# publishing from Conventional Commits.
[workspace]
# Publish the crate to crates.io on release. `publish = true` is the default;
# it's kept explicit as a reminder that the `release` job authenticates via
# crates.io Trusted Publishing (OIDC, `id-token: write`) rather than a
# CARGO_REGISTRY_TOKEN secret — see .github/workflows/release-plz.yml and the
# one-time crates.io setup in CONTRIBUTING.md.
publish = true
