name: release-plz

on:
  push:
    branches: [master]

jobs:
  # Opens/updates a "release" PR that bumps the version and updates CHANGELOG.md.
  # Uses the default GITHUB_TOKEN, so opening the PR requires the repo setting
  # Settings → Actions → General → "Allow GitHub Actions to create and approve
  # pull requests" to be enabled (one-time; see CONTRIBUTING.md).
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # When the release PR is merged, publishes the crate to crates.io via Trusted
  # Publishing, tags the commit, and creates the GitHub Release. `id-token: write`
  # lets release-plz mint a short-lived crates.io token from GitHub's OIDC
  # provider — no CARGO_REGISTRY_TOKEN secret. Configure the trusted publisher
  # once on crates.io (see CONTRIBUTING.md).
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The GitHub Release the `release` job creates is made with GITHUB_TOKEN, which
  # by design does NOT trigger other workflows — so release-binaries.yml's
  # `release: published` trigger won't fire. Invoke it here, in the same run, when
  # a release was actually cut, so binaries + the Homebrew bump still happen
  # without needing a PAT or GitHub App token.
  release-binaries:
    name: Release binaries
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
    secrets: inherit
